services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infosiga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infosiga}
      POSTGRES_DB: ${POSTGRES_DB:-infosiga}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infosiga} -d ${POSTGRES_DB:-infosiga}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
